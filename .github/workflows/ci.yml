name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: bz_get
          POSTGRES_USER: bz_get
          POSTGRES_PASSWORD: bz_get
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bz_get"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ci-secret-key
      DEBUG: "0"
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: bz_get
      POSTGRES_USER: bz_get
      POSTGRES_PASSWORD: bz_get
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            constraints.txt

      - name: Установить зависимости
        run: pip install -r requirements-dev.txt -c constraints.txt

      - name: Установить системные пакеты OCR
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-rus poppler-utils fonts-dejavu-core

      - name: Установить ClamAV (анти-фрод, Этап 3)
        run: sudo apt-get install -y -qq clamav-daemon

      - name: Проверить артефакты monitoring Этапа 4
        run: |
          bash -n deploy/monitoring/validate.sh
          bash deploy/monitoring/validate.sh

      - name: Проверить MinIO DR Этапа 4
        run: |
          bash -n deploy/minio/dr/validate.sh
          bash deploy/minio/dr/validate.sh

      - name: Проверить Alertmanager Этапа 4
        # Без установленного amtool helper выполняет shell-проверки и честно
        # пропускает только semantic check Alertmanager. На HA/DR стенде с
        # amtool тот же скрипт выполняет полноценный check-config.
        run: |
          bash -n deploy/alertmanager/validate.sh
          bash deploy/alertmanager/validate.sh

      - name: Проверить Patroni rebuild и объединённый DR drill Этапа 4
        # Runtime-style тесты используют fake patronictl/pgbackrest: проверяют
        # dry-run, запрет rebuild leader, approval-marker, параметры restore и
        # расчёт наблюдаемого RPO/RTO без подключения к production-инфре.
        run: |
          bash -n deploy/dr/validate-part4.sh
          bash deploy/dr/validate-part4.sh

      - name: Проверить стендовый acceptance harness Этапа 4
        # Fake Patroni/etcd/pgBackRest/MinIO/Alertmanager позволяют проверить
        # orchestration, fail-closed итог и RPO/RTO без разрушительных действий.
        run: |
          bash -n deploy/acceptance/validate.sh
          bash deploy/acceptance/validate.sh

      - name: manage.py check
        run: python manage.py check

      - name: Нет неучтённых изменений моделей
        run: python manage.py makemigrations --check --dry-run

      - name: Применить миграции
        run: python manage.py migrate

      - name: Тесты с покрытием
        run: |
          coverage run manage.py test
          coverage report --fail-under=85
          coverage report --include="apps/iam/security.py,apps/iam/middleware.py,apps/core/outbox.py" --fail-under=90
      - name: Real Redis and worker integration
        run: |
          celery -A config worker --pool=solo --loglevel=INFO > /tmp/bz-get-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" || true' EXIT
          python manage.py verify_async_delivery

      - name: Worker logs on failure
        if: failure()
        run: cat /tmp/bz-get-worker.log || true
