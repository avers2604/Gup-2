name: Task 7 append intake docs

on:
  push:
    branches: [feat/upload-validation-56]
    paths:
      - .github/workflows/task7-docs.yml

permissions:
  contents: write

jobs:
  append-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append pre-WORM intake contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          marker = '## Входная валидация файлов до storage/WORM'
          text = readme.read_text()
          if marker not in text:
              text += '''\n\n## Входная валидация файлов до storage/WORM\n\nНовые загрузки проверяются синхронно **до** записи в mutable staging или WORM `originals`. Общий лимит intake — **150 MiB**; тот же предел используется OCR-конвейером.\n\nКонтракт полей:\n\n- `NormativeDocument.files_original` — только структурно корректный PDF, соответствующий **PDF/A-2b**;\n- `NormativeDocument.files_editable` — валидный OOXML DOCX/XLSX, тип пакета должен совпадать с расширением;\n- `Template.file_editable` — валидный OOXML DOCX/XLSX с тем же правилом совпадения типа;\n- `Template.file_sample` — валидный обычный PDF; соответствие PDF/A для образца не требуется.\n\nПорядок проверки новой загрузки: **размер → формат/структура → ClamAV → macro/ActiveX для OOXML → staging/storage**. Ошибка, timeout или отсутствие Poppler/veraPDF трактуются fail-closed: файл не сохраняется. Макросы/ActiveX по-прежнему запрещены после успешной OOXML-проверки.\n\nPDF/A проверяется локальным veraPDF Greenfield 1.30.2 с фиксированным профилем `2b`; CI выполняет реальный smoke на PostgreSQL 16 и 18. Установка, checksum pin, signing-key fingerprint и процедура обновления описаны в [`deploy/verapdf/README.md`](deploy/verapdf/README.md).\n'''
              readme.write_text(text)

          stack = Path('STACK.md')
          marker = '## Pre-WORM валидация входных файлов'
          text = stack.read_text()
          if marker not in text:
              text += '''\n\n## Pre-WORM валидация входных файлов\n\nКонтроль загрузок вынесен в `apps/core/upload_validation.py` и выполняется только для новых upload-объектов до ClamAV и любого storage write. Existing `FieldFile` references повторно не валидируются.\n\nИнварианты intake:\n\n1. `UPLOAD_MAX_BYTES = 150 MiB`, `OCR_MAX_BYTES = UPLOAD_MAX_BYTES`.\n2. НРД original: Poppler structural check + veraPDF **PDF/A-2b**.\n3. НРД/template editable: ZIP/OOXML structural check, обязательные package parts и main-part MIME, затем ClamAV и macro/ActiveX gate.\n4. Template sample: обычный структурно корректный PDF через Poppler; PDF/A не требуется.\n5. Любая недоступность/timeout/unexpected exit внешнего validator — fail-closed.\n6. Rejected upload не должен создавать объект в staging, mutable file storage или WORM originals.\n\nveraPDF runtime закреплён на **Greenfield 1.30.2**, профиль `2b` не конфигурируется. Installer SHA-256 хранится в `deploy/verapdf/SHA256SUMS`; deployment использует `deploy/verapdf/install.sh` и `deploy/verapdf/validate.sh`. При смене версии maintainer сначала проверяет upstream detached signature и полный fingerprint, затем обновляет checksum. Полная процедура — `deploy/verapdf/README.md`.\n\nCI на PostgreSQL 16/18 устанавливает тот же pinned runtime и выполняет real-runtime smoke на vendored pass/fail fixtures из `veraPDF/veraPDF-corpus`, после чего запускает полный Django suite, coverage и live Redis worker integration.\n'''
              stack.write_text(text)
          PY

      - name: Commit documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md STACK.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: document pre-WORM intake validation"
          git push origin HEAD:feat/upload-validation-56
