services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in infra env}
      # Bootstrap/admin credentials exist only in the infrastructure secret set.
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER must be set in infra env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD must be set in infra env}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER must be set in infra env}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:?POSTGRES_MIGRATION_USER must be set in infra env}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD must be set in infra env}
      # Long-lived application credentials remain separate and non-owner.
      POSTGRES_RUNTIME_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in infra env}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in infra env}
      GRAFANA_POSTGRES_USER: ${GRAFANA_POSTGRES_USER:?GRAFANA_POSTGRES_USER must be set in infra env}
      GRAFANA_POSTGRES_PASSWORD: ${GRAFANA_POSTGRES_PASSWORD:?GRAFANA_POSTGRES_PASSWORD must be set in infra env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deploy/postgres/init-bootstrap.sh:/docker-entrypoint-initdb.d/10-bz-get-roles.sh:ro
      - ./deploy/postgres/bootstrap-roles.sql:/opt/bz-get/bootstrap-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER must be set in infra env}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runtime traffic uses only the non-owner application role. Migration/admin
  # credentials are intentionally not exposed to PgBouncer.
  pgbouncer:
    image: edoburu/pgbouncer:1.21.0
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
    ports:
      - "127.0.0.1:6432:6432"
    depends_on:
      - postgres

  # etcd — распределённое хранилище консенсуса для Patroni (ТЗ 4.9). Здесь —
  # одноузловая dev-конфигурация; кластер из 3+ узлов настраивается на Этапе 4.
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    environment:
      ETCD_NAME: etcd0
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: etcd0=http://etcd:2380
    ports:
      - "127.0.0.1:2379:2379"
    volumes:
      - etcd_data:/etcd-data

  # MinIO root credentials are bootstrap-only. Django uses MINIO_ACCESS_KEY /
  # MINIO_SECRET_KEY, provisioned by deploy/minio/init-bucket.sh with a policy
  # that cannot delete/bypass retention in the WORM originals bucket.
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data{1...4} --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in infra env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in infra env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data1:/data1
      - minio_data2:/data2
      - minio_data3:/data3
      - minio_data4:/data4

  mc:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    profiles: ["tools"]
    entrypoint: ["/bin/sh", "-c", "sleep infinity"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in infra env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in infra env}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in infra env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in infra env}
      MINIO_BUCKET_ORIGINALS: ${MINIO_BUCKET_ORIGINALS:?MINIO_BUCKET_ORIGINALS must be set in infra env}
      MINIO_BUCKET_WORKING: ${MINIO_BUCKET_WORKING:?MINIO_BUCKET_WORKING must be set in infra env}
    volumes:
      - ./deploy/minio/app-policy.json.tpl:/config/app-policy.json.tpl:ro
    depends_on:
      - minio

  redis:
    image: redis:8.10-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  clamav:
    image: clamav/clamav:1.4
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
      - ./deploy/clamav/clamd.conf:/etc/clamav/clamd.conf:ro

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in infra env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in infra env}
      GRAFANA_POSTGRES_USER: ${GRAFANA_POSTGRES_USER:?GRAFANA_POSTGRES_USER must be set in infra env}
      GRAFANA_POSTGRES_PASSWORD: ${GRAFANA_POSTGRES_PASSWORD:?GRAFANA_POSTGRES_PASSWORD must be set in infra env}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - postgres

volumes:
  postgres_data:
  minio_data1:
  minio_data2:
  minio_data3:
  minio_data4:
  redis_data:
  etcd_data:
  clamav_data:
  prometheus_data:
  grafana_data:
