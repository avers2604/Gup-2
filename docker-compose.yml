services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set in .env}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Пул соединений перед PostgreSQL (снижение риска: явно выделен в стек по
  # рекомендации ревью, ТЗ 4.8 подразумевает его неявно при HA-переключении
  # Patroni). Приложение пока подключено к postgres напрямую — маршрутизация
  # через pgbouncer (порт 6432) переключается на Этапе 4 вместе с Patroni.
  pgbouncer:
    image: edoburu/pgbouncer:1.21.0
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
    ports:
      - "127.0.0.1:6432:6432"
    depends_on:
      - postgres

  # etcd — распределённое хранилище консенсуса для Patroni (ТЗ 4.9). Здесь —
  # одноузловая dev-конфигурация; кластер из 3+ узлов настраивается на Этапе 4.
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    environment:
      ETCD_NAME: etcd0
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: etcd0=http://etcd:2380
    ports:
      - "127.0.0.1:2379:2379"
    volumes:
      - etcd_data:/etcd-data

  # MinIO Community Edition (AGPLv3) — решение риск-ревью вместо коммерческой
  # AIStor, см. STACK.md → «Лицензии». ВНИМАНИЕ: 4 диска на одном контейнере —
  # это ТОЛЬКО локальная эмуляция Distributed mode + Erasure Coding (ТЗ 4.9)
  # для проверки кода и образов; она НЕ отражает целевую эксплуатационную
  # топологию (число узлов/дисков — открытый вопрос, см. STACK.md). Два
  # бакета с разными политиками создаются отдельно (см. deploy/minio/
  # init-bucket.sh): originals — с Object Locking (WORM), working — без.
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data{1...4} --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data1:/data1
      - minio_data2:/data2
      - minio_data3:/data3
      - minio_data4:/data4

  # Разовая утилита для настройки бакетов MinIO (Object Locking/WORM для
  # originals, Versioning для working) — не запускается автоматически с
  # `up`, см. deploy/minio/init-bucket.sh.
  mc:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    profiles: ["tools"]
    entrypoint: ["/bin/sh", "-c", "sleep infinity"]
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env}
      MINIO_BUCKET_ORIGINALS: ${MINIO_BUCKET_ORIGINALS:?MINIO_BUCKET_ORIGINALS must be set in .env}
      MINIO_BUCKET_WORKING: ${MINIO_BUCKET_WORKING:?MINIO_BUCKET_WORKING must be set in .env}
    depends_on:
      - minio

  # Брокер очереди Celery — конвейер OCR (Этап 3, apps/documents/tasks.py).
  # Само приложение (веб + воркер Celery) в этом docker-compose не
  # контейнеризовано (см. README «Запуск») — воркер запускается локально:
  #   celery -A config worker -l info
  # (тем же .env/REDIS_URL, что и здесь; для тестов брокер не нужен —
  # CELERY_TASK_ALWAYS_EAGER=True, config/settings/base.py).
  redis:
    image: redis:8.10-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  # Антивирусная проверка загружаемых файлов (ТЗ 4.7). Демон поднят с
  # Этапа 1 для раннего тестирования интеграции; вызов clamd из конвейера
  # загрузки документов реализуется на Этапе 3 (анти-фрод и контроль
  # целостности). Первый запуск дольше обычного — скачивание баз сигнатур.
  clamav:
    image: clamav/clamav:1.4
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      # Переменные для подстановки в deploy/grafana/provisioning/datasources/postgres.yml
      # ($POSTGRES_DB и т.д.) — тот же Postgres, что и у самого приложения
      # (усиление аудита, решение Заказчика: алерты читают audit_auditlog
      # напрямую, см. deploy/grafana/provisioning/alerting/audit-alerts.yml).
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - postgres

volumes:
  postgres_data:
  minio_data1:
  minio_data2:
  minio_data3:
  minio_data4:
  redis_data:
  etcd_data:
  clamav_data:
  prometheus_data:
  grafana_data:
