services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bz_get}
      POSTGRES_USER: ${POSTGRES_USER:-bz_get}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bz_get}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bz_get}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Целевая версия — MinIO AIStor RELEASE.2026-09-07T08-39-31Z (см. STACK.md).
    # Реестр/образ AIStor у поставщика может отличаться от community minio/minio —
    # уточнить точный путь образа и лицензионные условия у DevOps перед прод-развёртыванием.
    image: minio/minio:RELEASE.2026-09-07T08-39-31Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-bz_get}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-bz_get_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:8.10-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  minio_data:
  redis_data:
