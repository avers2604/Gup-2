{# HTMX-фрагмент — ответ на POST iam:totp-enroll, заменяет #totp-enroll-panel #}
<p class="muted">Добавьте секрет в приложение-аутентификатор:</p>
<p class="data break-anywhere">{{ secret }}</p>
<p class="caption break-anywhere">
  <a href="{{ provisioning_uri }}">{{ provisioning_uri }}</a>
</p>
<p class="muted">Введите код из приложения, чтобы подтвердить подключение:</p>
<form class="stack stack--tight"
  method="post" hx-post="{% url 'iam:totp-confirm' %}" hx-target="#totp-enroll-panel" hx-swap="innerHTML">
  {% csrf_token %}
  {% include "ui/field.html" with field=form.code %}
  <div class="form-actions">
    <button class="btn btn--primary" type="submit">Подтвердить</button>
  </div>
</form>
