{% extends "base.html" %}
{% block title %}Вход · АИС «БЗ ГЭТ»{% endblock %}
{% block content %}
  <p class="eyebrow">Вход в систему</p>
  <h1 class="title">АИС «БЗ ГЭТ»</h1>

  <div class="card card--narrow stack stack--tight">
    {% if form.non_field_errors %}
      <p class="field-error">
        {{ form.non_field_errors.0 }}
      </p>
    {% endif %}
    <form method="post" novalidate>
      {% csrf_token %}
      <label class="field-label" for="{{ form.personnel_number.id_for_label }}">Табельный номер</label>
      {{ form.personnel_number }}
      <label class="field-label" for="{{ form.password.id_for_label }}">Пароль</label>
      {{ form.password }}
      <label class="caption row row--tight">
        {{ form.shared_terminal }} {{ form.shared_terminal.label }}
      </label>
      <button class="btn btn--primary" type="submit">Войти</button>
    </form>
  </div>
{% endblock %}
