# Grafana reads the WORM audit source with a dedicated PostgreSQL login.
# The role is provisioned by deploy/postgres/bootstrap-roles.sql and receives
# SELECT only on audit_auditlog in post-migrate-grants.sql. It never receives
# the Django runtime or migration credentials.
apiVersion: 1

datasources:
  - uid: audit-postgres
    name: PostgreSQL (audit_auditlog)
    type: postgres
    access: proxy
    url: postgres:5432
    database: $POSTGRES_DB
    user: $GRAFANA_POSTGRES_USER
    secureJsonData:
      password: $GRAFANA_POSTGRES_PASSWORD
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: false
    editable: false
