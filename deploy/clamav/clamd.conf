# Переопределение конфигурации clamd для docker-compose.yml — поднимает
# лимиты размера потока/файла под ТЗ 1.2 §4.2.1 (скан-оригинал НРД — до
# 150 МБ). Заводской дефолт ClamAV (StreamMaxLength 25M) меньше этого
# лимита и молча обрезал бы/отклонял сканирование больших сканов через
# протокол INSTREAM (apps/core/antivirus.py, scan_file()).
#
# ЧЕСТНАЯ ГРАНИЦА: не проверено вживую против конкретного образа
# clamav/clamav:1.4 (нет Docker-демона в песочнице разработки, см.
# STACK.md → «Локальная разработка в этой сессии») — сами по себе
# директивы стандартны для clamd (проверены вживую в этой сессии на
# clamav-daemon 1.5.3 из Ubuntu 24.04, apps/core/tests/clamd_fixture.py),
# но взаимодействие именно с entrypoint/healthcheck этого Docker-образа
# не подтверждено. Проверить перед вводом в опытную эксплуатацию.

TCPSocket 3310
TCPAddr 0.0.0.0
LocalSocket /var/run/clamav/clamd.ctl
FixStaleSocket true

DatabaseDirectory /var/lib/clamav
LogFile /var/log/clamav/clamav.log
LogTime true
PidFile /var/run/clamav/clamd.pid

# Запас над лимитом 150 МБ (ТЗ 1.2 §4.2.1) — с явным запасом на будущее
# изменение лимита, не впритык.
StreamMaxLength 200M
MaxFileSize 200M
MaxScanSize 200M
