[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["migrations", "tests"]

[tool.ruff.lint]
# Start with correctness-oriented rules that catch syntax/name bugs without
# forcing a repo-wide style rewrite in the same PR.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
exclude = "(^|/)(migrations|tests|management)(/|$)"
